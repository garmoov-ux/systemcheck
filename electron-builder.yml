appId: com.inno.systemcheck
productName: SystemCheck
directories:
  buildResources: build
  output: release
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!tests/*"
  - "!legacy_src/*"
  - "!viewer/*"
  - "!SystemCheck.exe"
  - "!electron.vite.config.*"
  - "!vitest.config.*"
  - "!tsconfig.*"
asarUnpack:
  - "**/*.node"
extraFiles:
  - from: "config.json"
    to: "config.json"
  - from: "check/data.csv"
    to: "check/data.csv"
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "SystemCheck_Setup.exe"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "SystemCheck_Portable.exe"
